<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IPEC | Join Expense Manager</title>
  <script src="js/env.js" defer></script>
  <script src="js/tenant-routing.js" defer></script>
  <link rel="icon" type="image/jpeg" href="ipec.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.98);
      --glass-border: rgba(0, 0, 0, 0.08);
      --text-main: #1a1a1a;
      --text-muted: #666;
      --brand: #1546C0;
      --brand-hover: #0d38a0;
      --success: #10b981;
      --error: #ef4444;
    }
    .dark-mode {
      --glass: rgba(20, 20, 20, 0.95);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f5f5f5;
      --text-muted: #999;
      --brand: #3b82f6;
      --brand-hover: #60a5fa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      transition: background 0.3s ease;
    }
    body.dark-mode { background: #000; }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .dual-logos {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .dual-logos img {
      height: 32px;
      width: auto;
      object-fit: contain;
    }
    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
    }
    .input-grp { margin-bottom: 12px; }
    label { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px; }
    input {
      width: 100%;
      background: rgba(0,0,0,0.02);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus { border-color: var(--brand); background: transparent; box-shadow: 0 0 0 3px rgba(21, 70, 192, 0.08); }
    .dark-mode input { background: rgba(255,255,255,0.03); }
    
    .btn-primary {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary:hover { background: var(--brand-hover); transform: translateY(-1px); }
    
    .footer-links { margin-top: 20px; text-align: center; font-size: 12px; }
    .footer-links a { color: var(--brand); text-decoration: none; margin: 0 8px; font-weight: 600; }
    .footer-links a:hover { color: var(--brand-hover); text-decoration: underline; }
    
    .toast { min-height: 20px; margin-top: 12px; font-size: 13px; text-align: center; font-weight: 600; }
    .toast.error { color: var(--error); }
    .toast.success { color: var(--success); }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="dual-logos">
      <img src="ipec.jpg" alt="IPEC">
      <img src="excenor.png" alt="Excenor">
    </div>
    <h1 id="dyn-title">Welcome</h1>
    <p class="subtitle" id="dyn-sub">Set up your profile to access the organization's portal.</p>

    <form id="auth-form">
      <div class="input-grp">
        <label id="dyn-email-label">Email</label>
        <input id="email" type="email" placeholder="name@company.com" required autofocus>
      </div>
      <div class="input-grp">
        <label>Password</label>
        <input id="password" type="password" placeholder="Min 8 characters" minlength="8" required>
      </div>
      <div class="input-grp">
        <label>Verify</label>
        <input id="confirm" type="password" placeholder="Repeat password" required>
      </div>
      <button id="btn-submit" type="submit" class="btn-primary">
        <span id="btn-text">Join Ecosystem</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div id="msg" class="toast"></div>

    <div class="footer-links">
      <a href="login.html">Sign In</a>
      <a href="signup.html?next=company.html">New Setup</a>
      <a href="privacy.html">Privacy</a>
    </div>
  </div>

  <script>
    (function() {
        const p = new URLSearchParams(window.location.search);
        const isConfig = (p.get("next") || "").includes("company.html");
        if (isConfig) {
            const h = document.getElementById("dyn-title");
            const s = document.getElementById("dyn-sub");
            const l = document.getElementById("dyn-email-label");
            const b = document.getElementById("btn-text");
            if (h) h.textContent = "Start with Expense Manager";
            if (s) s.textContent = "Create your administrator workspace for the company.";
            if (l) l.textContent = "Business Email";
            if (b) b.textContent = "Continue to Setup";
            document.title = "IPEC | Workspace Setup";
        }
        if (p.has("email")) document.getElementById("email").value = p.get("email");
        if (localStorage.getItem('explyra-theme') === 'dark') document.body.classList.add('dark-mode');
    })();
  </script>

  <script type="module">
    import "./js/auth-gateway.js";
    const gateway = window.ExplyraAuthGateway;
    const msg = document.getElementById("msg");
    const qs = new URLSearchParams(window.location.search);
    const nextHint = qs.get("next") || "";

    function show(t, type = "") { msg.textContent = t; msg.className = `toast ${type}`; }

    document.getElementById("auth-form").onsubmit = async (e) => {
      e.preventDefault();
      show("Processing...");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (password !== confirm) return show("Passwords mismatched", "error");
      
      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      try {
        const { userData } = await gateway.activateExistingAccount(email, password);
        show("Ready! Redirecting...", "success");
        await gateway.redirectForUser(userData, nextHint);
      } catch (err) {
        show(err.message, "error");
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
