<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1546C0">
  <link rel="manifest" href="manifest.json">
  <title>Explyra Login</title>
  <script src="js/env.js"></script>
  <script src="js/tenant-routing.js"></script>
  <link rel="icon" type="image/png" href="assets/images/explyra_logo.png">
  <style>
    :root {
      --bg: #f2f2f2;
      --ink: #1b1b1b;
      --muted: #616161;
      --line: #d0d0d0;
      --brand: #0067b8;
      --brand2: #0f7b0f;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #f7f7f7 0%, #ececec 100%);
      min-height: 100vh;
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 0;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      padding: 44px;
    }
    .logo-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .logo-wrap img { width: 32px; height: 32px; border-radius: 4px; }
    h1 { margin: 0; font-size: 1.7rem; font-weight: 600; letter-spacing: -.01em; }
    .sub { margin: 6px 0 18px; color: var(--muted); font-size: .92rem; text-align: left; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .tab {
      border: 1px solid #c9c9c9;
      border-radius: 0;
      background: #f8f8f8;
      color: var(--muted);
      padding: 9px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: .78rem; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
    input {
      width: 100%;
      border: 1px solid #8a8886;
      background: #fff;
      border-radius: 0;
      padding: 11px;
      font-size: .95rem;
      color: var(--ink);
    }
    input:focus { outline: 2px solid rgba(0,103,184,.26); border-color: var(--brand); }
    .btn {
      width: 100%;
      border: 0;
      border-radius: 0;
      padding: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .12s ease;
    }
    .btn:active { transform: scale(.985); }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-secondary { background: #fff; border: 1px solid #8a8886; color: var(--ink); margin-top: 8px; }
    .meta {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: .84rem;
      flex-wrap: wrap;
    }
    .meta a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .toast { margin-top: 10px; min-height: 20px; font-size: .86rem; }
    .toast.error { color: var(--danger); }
    .toast.success { color: var(--brand2); }
    .step-email {
      margin-bottom: 10px;
      display: none;
      background: #f3f7fb;
      border: 1px dashed #87b3d8;
      color: #10416a;
      border-radius: 0;
      padding: 8px 10px;
      font-size: .84rem;
      font-weight: 600;
    }
    .create-company-inline {
      margin-top: 14px;
      font-size: .84rem;
      color: var(--muted);
      text-align: left;
    }
    .create-company-inline a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }
    @media (max-width: 480px) {
      .card { padding: 28px 18px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/images/explyra_logo.png" alt="Explyra">
      <h1>Sign in</h1>
    </div>
    <p class="sub">Use your work account to continue to Explyra.</p>

    <div class="tabs">
      <button id="tab-login" class="tab active" type="button">Login</button>
      <button id="tab-activate" class="tab" type="button">Activate</button>
    </div>

    <section id="panel-login" class="panel active">
      <form id="login-form">
        <div class="field">
          <label for="login-identifier">Email or Phone</label>
          <input id="login-identifier" type="text" autocomplete="username" required>
        </div>
        <div class="step-email" id="resolved-email"></div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" id="login-btn" type="submit">Sign In</button>
      </form>
      <button class="btn btn-secondary" id="google-btn" type="button">Continue with Google</button>
      <div class="meta">
        <a href="signup.html">Need activation setup?</a>
        <a href="#" id="forgot-link">Forgot password</a>
      </div>
      <p class="create-company-inline">First time setup? <a href="signup.html?next=company.html">Create your company workspace</a></p>
    </section>

    <section id="panel-activate" class="panel">
      <form id="activate-form">
        <div class="field">
          <label for="activate-email">Invited Email</label>
          <input id="activate-email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="activate-password">Create Password</label>
          <input id="activate-password" type="password" minlength="8" required>
        </div>
        <div class="field">
          <label for="activate-confirm">Confirm Password</label>
          <input id="activate-confirm" type="password" minlength="8" required>
        </div>
        <button class="btn btn-primary" id="activate-btn" type="submit">Activate Account</button>
      </form>
      <div class="meta">
        <a href="signup.html">Open full signup page</a>
        <a href="signup.html?next=company.html">Create company</a>
      </div>
    </section>

    <div id="toast" class="toast"></div>
    <p class="sub" style="margin-top:10px;font-size:.8rem;">
      By continuing, you agree to <a href="terms.html" style="color:#0067b8;text-decoration:none;font-weight:600;">Terms</a>
      and <a href="privacy.html" style="color:#0067b8;text-decoration:none;font-weight:600;">Privacy Policy</a>.
    </p>
  </div>

  <script type="module">
    import "./js/auth-gateway.js";

    const gateway = window.ExplyraAuthGateway;
    const qs = new URLSearchParams(window.location.search);
    const nextHint = qs.get("next") || "";
    const wantsCompanySetup = nextHint === "company.html";

    const tabLogin = document.getElementById("tab-login");
    const tabActivate = document.getElementById("tab-activate");
    const panelLogin = document.getElementById("panel-login");
    const panelActivate = document.getElementById("panel-activate");
    const toast = document.getElementById("toast");
    const resolvedEmailEl = document.getElementById("resolved-email");

    function showToast(msg, type = "") {
      toast.textContent = msg || "";
      toast.className = `toast ${type}`;
    }

    function setActiveTab(mode) {
      const loginMode = mode === "login";
      tabLogin.classList.toggle("active", loginMode);
      tabActivate.classList.toggle("active", !loginMode);
      panelLogin.classList.toggle("active", loginMode);
      panelActivate.classList.toggle("active", !loginMode);
    }

    tabLogin.addEventListener("click", () => setActiveTab("login"));
    tabActivate.addEventListener("click", () => setActiveTab("activate"));

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showToast("");
      const identifier = document.getElementById("login-identifier").value.trim();
      const password = document.getElementById("login-password").value;
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Signing in...";

      try {
        const resolved = await gateway.resolveEmailToPrimary(identifier);
        resolvedEmailEl.style.display = "block";
        resolvedEmailEl.textContent = `Using ${resolved}`;

        const { userData } = await gateway.signInWithIdentifier(identifier, password);
        await gateway.redirectForUser(userData, nextHint);
      } catch (err) {
        showToast(err?.message || "Unable to sign in.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });

    document.getElementById("activate-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showToast("");
      const email = document.getElementById("activate-email").value.trim();
      const pass = document.getElementById("activate-password").value;
      const confirm = document.getElementById("activate-confirm").value;
      if (pass !== confirm) {
        showToast("Passwords do not match.", "error");
        return;
      }
      const btn = document.getElementById("activate-btn");
      btn.disabled = true;
      btn.textContent = "Activating...";
      try {
        const { userData } = await gateway.activateExistingAccount(email, pass);
        showToast("Account activated. Redirecting...", "success");
        await gateway.redirectForUser(userData, nextHint);
      } catch (err) {
        showToast(err?.message || "Activation failed.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Activate Account";
      }
    });

    document.getElementById("forgot-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const identifier = document.getElementById("login-identifier").value.trim();
      if (!identifier) {
        showToast("Enter your email/phone first.", "error");
        return;
      }
      try {
        const email = await gateway.sendReset(identifier);
        showToast(`Reset link sent to ${email}.`, "success");
      } catch (err) {
        showToast(err?.message || "Reset failed.", "error");
      }
    });

    document.getElementById("google-btn").addEventListener("click", async () => {
      try {
        const { userData } = await gateway.signInWithGoogle();
        await gateway.redirectForUser(userData, nextHint);
      } catch (err) {
        showToast(err?.message || "Google sign-in failed.", "error");
      }
    });

    gateway.observeAuthState(async (user) => {
      if (!user?.email) return;
      const userData = await gateway.getUserByEmail(user.email);
      if (!userData) return;
      await gateway.redirectForUser(userData, nextHint);
    });

    const activationEmail = qs.get("email") || "";
    if (activationEmail) {
      setActiveTab("activate");
      document.getElementById("activate-email").value = activationEmail;
    }

    if (wantsCompanySetup && !activationEmail) {
      setActiveTab("activate");
      showToast("Create company ke liye pehle account activate karein.", "success");
    }
  </script>
</body>
</html>
